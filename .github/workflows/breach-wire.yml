name: breach-wire

# Runs every 4 hours (UTC): 00:30 04:30 08:30 12:30 16:30 20:30.
# GitHub's own schedule is best effort and in practice fired ~2-3 times a day, hours late. The main trigger
# is therefore an external cron calling workflow_dispatch on time (README, "Schedule"); the cron below is
# only a fallback. Each run refreshes both feeds and commits them together. ~6-9 billed minutes a day.
on:
  workflow_dispatch:  # external cron: POST /repos/d6falcon/breach-wire/actions/workflows/breach-wire.yml/dispatches
  schedule:
    - cron: '30 */4 * * *'  # fallback if the external trigger is down

permissions:
  contents: write

concurrency:
  group: breach-wire
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Refresh breach feed
        run: python3 scripts/breach_wire.py

      - name: Refresh vulnerability feed
        continue-on-error: true  # a vuln-wire failure must not block the breach feed
        env:
          GITHUB_TOKEN: ${{ github.token }}  # higher GitHub Advisory API rate limit
        run: python3 scripts/vuln_wire.py

      - name: Commit and push
        run: |
          git config user.name "d6falcon"
          git config user.email "9648746+d6falcon@users.noreply.github.com"
          git add breach-wire.md state/wire.tsv vuln-wire.md state/vuln-wire.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "feed: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
